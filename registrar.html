<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Crea una cuenta en SaveFood y comienza a disfrutar de ofertas de comida mientras ayudas a reducir el desperdicio de alimentos.">

    <title>Registro | SaveFood</title>

    <link rel="icon" type="image/svg+xml" href="resources/logo_mini.svg">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header-principal">
        <nav class="navegacion">
            <div class="logo">
                <a href="index.html">
                    <img src="resources/logo_full.svg" class="logo-img" alt="Logo SaveFood">
                </a>
            </div>
            <input type="checkbox" id="menu-check" class="menu-check">
            <label for="menu-check" class="menu-hamburguesa">☰</label>
            <ul class="enlaces-menu">
                <li><a href="menu.html">Menú</a></li>
                <li><a href="ofertas.html">Ofertas</a></li>
                <li><a href="form_pedido.html">Pedidos</a></li>
                <li><a href="pedidos.html">Mis Pedidos</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-login">
        <div class="card-login registro">
            <h1>Crear Cuenta</h1>
            <p>
                Regístrate para comenzar a rescatar comida y acceder a todas las funciones de SaveFood.
            </p>

            <form id="registroForm" novalidate>

                <div class="campo-form">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" maxlength="40">
                    <div class="mensaje-error" id="error-nombre"></div>
                </div>

                <div class="campo-form">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido" maxlength="40">
                    <div class="mensaje-error" id="error-apellido"></div>
                </div>

                <div class="campo-form">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" maxlength="100">
                    <div class="mensaje-error" id="error-correo"></div>
                </div>

                <div class="campo-form">
                    <label for="usuarioRegistro">Usuario</label>
                    <input type="text" id="usuarioRegistro" name="usuario" placeholder="Nombre de usuario" maxlength="30">
                    <div class="mensaje-error" id="error-usuarioRegistro"></div>
                </div>

                <div class="campo-form">
                    <label for="claveRegistro">Contraseña</label>
                    <div class="input-con-password">
                        <input type="password" id="claveRegistro" name="clave" placeholder="Contraseña" maxlength="30">
                        <button type="button" class="btn-ver-password" data-target="claveRegistro" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5c-6 0-9 7-9 7s3 7 9 7 9-7 9-7-3-7-9-7Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="mensaje-error" id="error-claveRegistro"></div>
                </div>

                <div class="campo-form">
                    <label for="confirmarClave">Confirmar contraseña</label>
                    <div class="input-con-password">
                        <input type="password" id="confirmarClave" name="confirmarClave" placeholder="Repita la contraseña" maxlength="30">
                        <button type="button" class="btn-ver-password" data-target="confirmarClave" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5c-6 0-9 7-9 7s3 7 9 7 9-7 9-7-3-7-9-7Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="mensaje-error" id="error-confirmarClave"></div>
                </div>

                <div class="mensaje-form" id="mensaje-registro"></div>

                <button type="submit" class="btn-login-form">
                    Registrarse
                </button>

            </form>

            <p class="texto-login">
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
