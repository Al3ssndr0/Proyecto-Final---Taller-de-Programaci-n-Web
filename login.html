<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Inicia sesión en SaveFood para acceder al menú, ofertas y realizar pedidos.">

    <title>Iniciar Sesión | SaveFood</title>

    <link rel="icon" type="image/svg+xml" href="resources/logo_mini.svg">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header-principal">
        <nav class="navegacion">
            <div class="logo">
                <a href="index.html">
                    <img src="resources/logo_full.svg"
                        class="logo-img"
                        alt="Logo SaveFood">
                </a>
            </div>
            <input type="checkbox" id="menu-check" class="menu-check">
            <label for="menu-check" class="menu-hamburguesa">☰</label>
            <ul class="enlaces-menu">
                <li><a href="menu.html">Menú</a></li>
                <li><a href="ofertas.html">Ofertas</a></li>
                <li><a href="form_pedido.html">Pedidos</a></li>
                <li><a href="pedidos.html">Mis Pedidos</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-login">
        <div class="card-login">
            <h1>Bienvenido</h1>
            <p>
                Inicia sesión para continuar utilizando SaveFood.
            </p>

            <form id="loginForm" novalidate>

                <div class="campo-form">
                    <label for="usuario">Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingrese su usuario"
                        maxlength="30">
                    <div class="mensaje-error" id="error-usuario"></div>
                </div>

                <div class="campo-form">
                    <label for="clave">Contraseña</label>
                    <div class="input-con-password">
                        <input
                            type="password"
                            id="clave"
                            name="clave"
                            placeholder="Ingrese su contraseña"
                            maxlength="30">
                        <button type="button" class="btn-ver-password" data-target="clave" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5c-6 0-9 7-9 7s3 7 9 7 9-7 9-7-3-7-9-7Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="mensaje-error" id="error-clave"></div>
                </div>

                <div class="mensaje-form" id="mensaje-login"></div>

                <button
                    type="submit"
                    class="btn-login-form">
                    Iniciar Sesión
                </button>

            </form>

            <p class="texto-login">
                ¿No tienes una cuenta?
                <a href="registrar.html">
                    Regístrate aquí
                </a>
            </p>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
